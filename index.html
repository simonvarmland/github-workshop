<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <title>Git-uppgift</title>
  </head>
  <body>
    <h1>Git-uppgift</h1>

    <script>
      function hamtaNamn() {
        return "Simon";
      }

      function addera(a, b) {
        return a + b;
      }

      function statusForTal(tal) {
        if (tal > 10) {
            return "ok";
        }
        return "för låg";
      }

      console.log(hamtaNamn())
      console.log(addera(1, 5))
      console.log(statusForTal(6))

    </script>
  </body>
</html>
